name: Package and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Read the pinned binary versions
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          echo "lsp=$(jq -r '."dsrv-lsp"' bundled-binaries.json)" >> "$GITHUB_OUTPUT"
          echo "checker=$(jq -r '."trustworthiness_checker"' bundled-binaries.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch every platform's binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LSP_TAG: ${{ steps.pins.outputs.lsp }}
          CHECKER_TAG: ${{ steps.pins.outputs.checker }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          for target in linux-x64 win32-x64 darwin-arm64 darwin-x64; do
            suffix=""
            if [ "$target" = "win32-x64" ]; then
              suffix=".exe"
            fi

            mkdir -p "bin/$target"

            gh release download "$LSP_TAG" \
              --repo INTO-CPS-Association/dsrv-lsp \
              --pattern "dsrv-lsp-${target}${suffix}" \
              --dir downloaded
            mv "downloaded/dsrv-lsp-${target}${suffix}" \
               "bin/$target/dsrv-lsp${suffix}"

            gh release download "$CHECKER_TAG" \
              --repo INTO-CPS-Association/robosapiens-trustworthiness-checker \
              --pattern "trustworthiness_checker-${target}${suffix}" \
              --dir downloaded
            mv "downloaded/trustworthiness_checker-${target}${suffix}" \
               "bin/$target/trustworthiness_checker${suffix}"
          done

          chmod +x bin/
          find bin -type f -exec ls -lh {} +

      - name: Confirm every platform's binaries are in the package
        shell: bash
        run: |
          set -euo pipefail
          included=$(npx vsce ls | grep -c '^bin/' || true)
          echo "files under bin/: $included"
          if [ "$included" -ne 8 ]; then
            echo "::error::expected 8 bundled binaries, found $included"
            npx vsce ls | grep '^bin/' || true
            exit 1
          fi

      - name: Package
        run: npx vsce package --out dsrv-vscode.vsix

      - name: Report and bound the package size
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(stat -c%s dsrv-vscode.vsix)
          echo "package size: $(numfmt --to=iec "$bytes")"
          if [ "$bytes" -gt $((250 * 1024 * 1024)) ]; then
            echo "::error::package exceeds the 250 MB Open VSX limit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dsrv-vscode.vsix
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" dsrv-vscode.vsix --clobber