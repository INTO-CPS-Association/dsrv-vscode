name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ts

      - name: Test
        if: runner.os != 'Linux'
        run: npm run test:ts

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package
        run: npx vsce package --out dsrv-vscode.vsix

      - name: List what went into the package
        run: npx vsce ls

      - uses: actions/upload-artifact@v4
        with:
          name: dsrv-vscode-vsix
          path: dsrv-vscode.vsix
          if-no-files-found: error